name: 02 - 🧹 Clean Torrent Downloads

on: workflow_dispatch

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set Git identity
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Delete entire torrents folder
        run: |
          echo "⚠️  This will delete all torrent downloads!"
          rm -rf torrents

      - name: Commit and push removal
        run: |
          git add -A torrents
          if ! git diff --cached --quiet; then
            git commit -m "Delete all torrent downloads [skip ci]"
            git push origin "${GITHUB_REF_NAME}"
            echo "✅  All torrents have been deleted."
          else
            echo "Nothing to clean."
          fi
