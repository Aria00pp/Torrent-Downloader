name: 01 - ⏬ Torrent Downloader & Split-ZIP

on:
  workflow_dispatch:
    inputs:
      magnet_links:
        description: '🔗 Magnet link(s), space or newline separated'
        required: true
        type: string
      password:
        description: '🔒 Password for ZIP encryption (leave blank for none)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  torrent-job:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure Git for large files
        run: |
          git config --global http.postBuffer 524288000
          git config --global http.maxRequestBuffer 100M
          git config --global core.compression 0
          git config --global pack.windowMemory 256m
          git config --global pack.packSizeLimit 100m
          git config --global pack.threads 1
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y aria2 zip jq python3

      - name: Create working folder
        run: mkdir -p torrents

      - name: Download torrent(s) – space or newline separated magnets
        env:
          MAGNET_LINKS: ${{ github.event.inputs.magnet_links }}
        run: |
          > /tmp/magnets.txt
          # Replace newlines with spaces, then split on spaces
          read -ra ALL_MAGNETS <<< "$(echo "$MAGNET_LINKS" | tr '\n' ' ')"
          for magnet in "${ALL_MAGNETS[@]}"; do
            [ -z "$magnet" ] && continue
            echo "$magnet" >> /tmp/magnets.txt
          done

          echo "Starting parallel download of ${#ALL_MAGNETS[@]} torrent(s)"
          aria2c \
            --dir=torrents \
            --seed-time=0 \
            --bt-save-metadata=true \
            --max-connection-per-server=16 \
            --split=16 \
            --min-split-size=1M \
            --bt-max-peers=100 \
            --bt-request-peer-speed-limit=0 \
            --enable-dht=true \
            --enable-dht6=true \
            --enable-peer-exchange=true \
            --bt-enable-lpd=true \
            --bt-tracker-connect-timeout=10 \
            --bt-tracker-timeout=30 \
            --bt-tracker-interval=10 \
            --disable-ipv6=false \
            "${ALL_MAGNETS[@]}"

      - name: Process downloads into split ZIPs + README
        env:
          ZIP_PASSWORD: ${{ github.event.inputs.password }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          BRANCH: ${{ github.ref_name }}
        run: |
          cd torrents
          rm -f *.torrent

          # Fixed urlencode (no trailing newline)
          urlencode() {
            python3 -c "import urllib.parse, sys; sys.stdout.write(urllib.parse.quote(sys.argv[1], safe=''))" "$1"
          }

          # Escape special shell glob characters (like brackets)
          glob_escape() {
            printf '%s' "$1" | sed 's/\[/\\\[/g; s/\]/\\\]/g; s/\*/\\*/g; s/\?/\\?/g'
          }

          # Escape characters that can break Markdown tables and link labels
          markdown_escape() {
            python3 -c 'import sys; sys.stdout.write(sys.argv[1].replace("\\", "\\\\").replace("|", "\\|").replace("[", "\\[").replace("]", "\\]"))' "$1"
          }

          BASE_URL="https://github.com/${REPO_OWNER}/${REPO_NAME}/raw/refs/heads/${BRANCH}/torrents"

          mapfile -t MAGNETS < /tmp/magnets.txt
          MAGNET_INDEX=0

          > /tmp/master_entries.txt

          for item in *; do
            [ -e "$item" ] || continue
            base="$(basename "$item")"
            [ "$base" = "README.md" ] && continue

            temp_dir="${base}.tmp"
            mkdir -p "$temp_dir"
            mv "$item" "$temp_dir/"
            mv "$temp_dir" "$base"
            cd "$base"

            original_item="$(ls)"
            [ -z "$original_item" ] && { echo "Empty folder: $base"; cd ..; rm -rf "$base"; continue; }

            if [ -n "$ZIP_PASSWORD" ]; then
              zip -0 -r -P "$ZIP_PASSWORD" -s 45m "${base}.zip" "$original_item"
              encryption="YES ✅"
            else
              zip -0 -r -s 45m "${base}.zip" "$original_item"
              encryption="NO ❌"
            fi

            rm -rf "$original_item"

            # --- Count parts safely (escape special chars) ---
            base_escaped=$(glob_escape "$base")
            readarray -d '' part_files < <(find . -maxdepth 1 \( -name "${base_escaped}.zip" -o -name "${base_escaped}.z[0-9]*" \) -print0 | sort -zV)
            part_count=${#part_files[@]}
            total_bytes=0
            for f in "${part_files[@]}"; do
              [ -f "$f" ] && total_bytes=$(( total_bytes + $(stat -c%s "$f") ))
            done
            total_mb=$(python3 -c "import sys; print(f'{int(sys.argv[1]) / 1048576:.2f}')" "$total_bytes")

            if [ $MAGNET_INDEX -lt ${#MAGNETS[@]} ]; then
              current_magnet="${MAGNETS[$MAGNET_INDEX]}"
              MAGNET_INDEX=$((MAGNET_INDEX + 1))
            else
              current_magnet="N/A"
            fi

            # --- Build README.md inside this folder ---
            base_display=$(markdown_escape "$base")
            magnet_display=$(markdown_escape "$current_magnet")

            {
              echo "# ${base}"
              echo ""
              echo "---"
              echo ""
              echo "## File Information"
              echo ""
              echo "| Property | Value |"
              echo "|----------|-------|"
              echo "| **File Name** | ${base_display} |"
              echo "| **Original Magnet** | ${magnet_display} |"
              echo "| **Total Size** | ${total_mb} MB |"
              echo "| **Total Parts** | ${part_count} |"
              echo "| **Password Protected** | ${encryption} |"
              echo "| **Status** | Complete (100%) |"
              echo ""
              echo "## Download Links"
              echo ""
              echo "| # | File | Link |"
              echo "|---|------|------|"
            } > README.md

            link_num=0
            folder_enc=$(urlencode "$base")
            for part in "${part_files[@]}"; do
              link_num=$((link_num + 1))
              part_name="$(basename "$part")"
              part_enc=$(urlencode "$part_name")
              part_display=$(markdown_escape "$part_name")
              raw_link="${BASE_URL}/${folder_enc}/${part_enc}"
              echo "| ${link_num} | ${part_display} | [Download](${raw_link}) |" >> README.md
            done

            {
              echo ""
              if [ "$part_count" -gt 1 ]; then
                echo "> Download all parts into the same folder, then open the main \`.zip\` file. The other parts will be found automatically."
              else
                echo "> This download is a single ZIP archive. Download and open the \`.zip\` file."
              fi
              echo ""
              echo "## How to Extract"
              echo ""
              echo "| OS | Steps |"
              echo "|----|-------|"
              if [ -n "$ZIP_PASSWORD" ]; then
                echo "| **Windows** | Open the main \`.zip\` file with [7-Zip](https://www.7-zip.org/) or WinRAR, extract it, and enter the password. |"
                echo "| **Mac** | Open the main \`.zip\` file with [Keka](https://www.keka.io/), extract it, and enter the password. |"
                echo "| **Linux** | Open the main \`.zip\` file with your archive manager and enter the password. |"
                echo "| **Android** | Open the main \`.zip\` file with [ZArchiver](https://play.google.com/store/apps/details?id=ru.zdevs.zarchiver), extract it, and enter the password. |"
              else
                echo "| **Windows** | Open the main \`.zip\` file with File Explorer, [7-Zip](https://www.7-zip.org/), or WinRAR, then extract it. |"
                echo "| **Mac** | Open the main \`.zip\` file with Archive Utility or [Keka](https://www.keka.io/), then extract it. |"
                echo "| **Linux** | Open the main \`.zip\` file with your archive manager, or use \`unzip\`. |"
                echo "| **Android** | Open the main \`.zip\` file with your file manager or [ZArchiver](https://play.google.com/store/apps/details?id=ru.zdevs.zarchiver), then extract it. |"
              fi
              echo ""
              echo "---"
              echo ""
              echo "*Created by Torrent Downloader*"
            } >> README.md

            # Master entry
            folder_link="${BASE_URL}/${folder_enc}/README.md"
            printf '| [%s](%s) | %s | %s MB |\n' "$base_display" "$folder_link" "$part_count" "$total_mb" >> /tmp/master_entries.txt

            cd ..
          done

          # --- Create master README inside torrents/ ---
          rm -rf README.md

          {
            echo "# TORRENT DOWNLOADS LIST :"
            echo ""
            echo "Each download below links to its own README with file details, direct download links, and extraction instructions."
            echo ""
            echo "| # | Download | Parts | Total Size |"
            echo "|---|----------|------:|-----------:|"
          } > README.md

          num=0
          while IFS= read -r entry; do
            num=$((num + 1))
            echo "| ${num} ${entry}" >> README.md
          done < /tmp/master_entries.txt

          {
            echo ""
            echo "---"
            echo ""
            echo "*Last updated: $(date -u +"%Y-%m-%d %H:%M UTC")*"
          } >> README.md

      - name: Push to repository
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          git fetch origin "$BRANCH"
          git reset --hard origin/"$BRANCH"

          git add torrents/
          if ! git diff --cached --quiet; then
            git commit -m "Torrent download [skip ci]"
            for i in {1..10}; do
              if timeout 300 git push origin HEAD:"$BRANCH"; then
                echo "✅ Push successful"
                break
              fi
              sleep 5
              git fetch origin "$BRANCH"
              git reset --hard origin/"$BRANCH"
              git add torrents/
              git diff --cached --quiet || git commit --amend -m "Torrent download [skip ci]"
            done
          fi
